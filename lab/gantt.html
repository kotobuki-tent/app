<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>在庫ガント（試作）</title>
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:14px;color:#222;background:#f6f7f8}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:3}
header h1{font-size:17px;margin:0 10px 0 0}
header input,header select,header button{font:inherit;padding:4px 8px;border:1px solid #bbb;border-radius:4px;background:#fff}
header .cat button{border-radius:999px;padding:3px 10px;cursor:pointer}header .cat button.on{background:#222;color:#fff;border-color:#222}
main{padding:10px 14px 40px}
.legend{display:flex;gap:14px;font-size:12px;color:#555;margin:6px 0 10px;flex-wrap:wrap}.legend i{display:inline-block;width:14px;height:10px;border-radius:2px;vertical-align:middle;margin-right:4px}
.g{display:grid;grid-template-columns:220px 1fr;border:1px solid #ddd;background:#fff;border-radius:6px;overflow:clip}
.g .hd{position:sticky;top:var(--hh,46px);z-index:2;background:#fafafa;border-bottom:1px solid #ddd}
.g .name{padding:6px 10px;border-bottom:1px solid #eee;border-right:1px solid #ddd;display:flex;justify-content:space-between;align-items:center;gap:6px}
.g .name b{font-weight:600}.g .name .tot{color:#888;font-size:12px;white-space:nowrap}
.g .cat{grid-column:1/3;background:#eef1f5;padding:4px 10px;font-weight:700;font-size:12px;color:#555;border-bottom:1px solid #ddd}
.tl{position:relative;border-bottom:1px solid #eee;min-height:30px}
.days{display:grid;height:100%}.days>div{border-right:1px solid #f0f0f0;font-size:11px;text-align:center;color:#777;padding:3px 0 2px;white-space:nowrap;overflow:hidden;line-height:1.25}.days .dw{display:block;font-size:9px;color:#999;overflow:hidden;text-overflow:ellipsis}.days>div.sat .dw{color:#3b6fd8}.days>div.sun .dw,.days>div.hol .dw{color:#d33}.days>div.today .dw{color:#c60}
.days>div.sat{background:#f2f6ff}.days>div.sun,.days>div.hol{background:#fff1f1}.days>div.today{background:#fffbe0;font-weight:700;color:#c60}
.bg{position:absolute;inset:0;display:grid}.bg>div{border-right:1px solid #f0f0f0}.bg>div.sat{background:#f6f9ff}.bg>div.sun,.bg>div.hol{background:#fff6f6}.bg>div.today{background:#fffbe0}
.bar{position:absolute;height:20px;border-radius:4px;font-size:11px;line-height:20px;padding:0 6px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-sizing:border-box;cursor:default}
.bar.est{background:#cfd8e3;color:#345;border:1px dashed #8aa}.bar.res{background:#5b8def}.bar.out{background:#2e9e5b}.bar.mnt{background:#e0862c}.bar.dsp{background:#8d6e63}.bar.oth{background:#999}
.free{position:absolute;left:0;right:0;bottom:0;height:14px;display:grid}.free>div{font-size:10px;text-align:center;line-height:14px;color:#aaa}.free>div.low{color:#d33;font-weight:700}.free>div.zero{color:#fff;background:#d33;font-weight:700}
.used{position:absolute;left:0;right:0;bottom:14px;height:14px;display:grid}.used>div{font-size:10px;text-align:center;line-height:14px;color:#667}
.lbl{position:absolute;left:2px;font-size:9px;color:#bbb;line-height:14px}
.empty{color:#999;padding:20px}
</style></head><body>
<header><h1>在庫ガント（試作）</h1>
<label>開始 <input type="date" id="d0"></label><label>日数 <select id="dn"><option>14</option><option selected>31</option><option>62</option><option>92</option></select></label>
<button onclick="go(-7)">←1週</button><button onclick="today()">今日</button><button onclick="go(7)">1週→</button>
<span class="cat" id="cats"></span><span id="st" style="margin-left:auto;color:#777;font-size:12px"></span></header>
<main><div class="legend"><span><i style="background:#cfd8e3;border:1px dashed #8aa"></i>仮押さえ（見積中）</span><span><i style="background:#5b8def"></i>予約</span><span><i style="background:#2e9e5b"></i>貸出中</span><span><i style="background:#e0862c"></i>メンテ待ち・中</span><span><i style="background:#8d6e63"></i>廃棄予定（物はあるが貸せない）</span><span>帯の下の数字＝上段 <b>出</b>（その日に出ている数）・下段 <b>残</b>（空き、減った日だけ）</span></div><div id="out" class="empty">読み込み中…</div></main>
<script>
var API='https://script.google.com/macros/s/AKfycbwD5F1rJcdg7pl1lnVXzyY0vttcO88z-YKUZWG3eLIT0DNMhFZw8jXbJoKW6wCIKEC7/exec';
var ITEMS=[],RENT=[],PROJ={},CAT='';
var $=function(i){return document.getElementById(i)};
// 日本の祝日（SPAのHOLIDAYSと同じ表）
var HOL={'2025-01-01':'元日','2025-01-13':'成人の日','2025-02-11':'建国記念の日','2025-02-23':'天皇誕生日','2025-02-24':'振替休日','2025-03-20':'春分の日','2025-04-29':'昭和の日','2025-05-03':'憲法記念日','2025-05-04':'みどりの日','2025-05-05':'こどもの日','2025-05-06':'振替休日','2025-07-21':'海の日','2025-08-11':'山の日','2025-09-15':'敬老の日','2025-09-23':'秋分の日','2025-10-13':'スポーツの日','2025-11-03':'文化の日','2025-11-23':'勤労感謝の日','2025-11-24':'振替休日','2026-01-01':'元日','2026-01-12':'成人の日','2026-02-11':'建国記念の日','2026-02-23':'天皇誕生日','2026-03-20':'春分の日','2026-04-29':'昭和の日','2026-05-03':'憲法記念日','2026-05-04':'みどりの日','2026-05-05':'こどもの日','2026-05-06':'振替休日','2026-07-20':'海の日','2026-08-11':'山の日','2026-09-21':'敬老の日','2026-09-22':'国民の休日','2026-09-23':'秋分の日','2026-10-12':'スポーツの日','2026-11-03':'文化の日','2026-11-23':'勤労感謝の日','2027-01-01':'元日','2027-01-11':'成人の日','2027-02-11':'建国記念の日','2027-02-23':'天皇誕生日','2027-03-21':'春分の日','2027-03-22':'振替休日','2027-04-29':'昭和の日','2027-05-03':'憲法記念日','2027-05-04':'みどりの日','2027-05-05':'こどもの日','2027-07-19':'海の日','2027-08-11':'山の日','2027-09-20':'敬老の日','2027-09-23':'秋分の日','2027-10-11':'スポーツの日','2027-11-03':'文化の日','2027-11-23':'勤労感謝の日'};
function dcls(d,t){var s=ymd(d),w=d.getDay();return s===t?'today':HOL[s]?'hol':w===6?'sat':w===0?'sun':''}
function fixHd(){var hd=document.querySelector('header');if(hd)document.documentElement.style.setProperty('--hh',hd.offsetHeight+'px')}
window.addEventListener('resize',fixHd);
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function today(){$('d0').value=ymd(new Date(Date.now()-3*86400000));render()}
function go(n){var d=new Date($('d0').value+'T00:00:00');d.setDate(d.getDate()+n);$('d0').value=ymd(d);render()}
function cls(r){var st=r.status||'';if(st==='貸出中')return'out';if(st==='メンテ待ち'||st==='メンテ中')return'mnt';if(st==='廃棄予定')return'dsp';if(st==='予約'){var p=PROJ[r.client_name];return (p==='見積中')?'est':'res'}return'oth'}
function render(){
  var d0=new Date($('d0').value+'T00:00:00'),N=Number($('dn').value);var days=[];for(var i=0;i<N;i++){var d=new Date(d0);d.setDate(d.getDate()+i);days.push(d)}
  var t=ymd(new Date());var dstr=days.map(ymd);
  var cats=[];ITEMS.forEach(function(i){if(i.category&&cats.indexOf(i.category)<0)cats.push(i.category)});
  $('cats').innerHTML='<button class="'+(CAT?'':'on')+'" onclick="CAT=\'\';render()">すべて</button>'+cats.map(function(c){return '<button class="'+(CAT===c?'on':'')+'" onclick="CAT=\''+c.replace(/'/g,"\\'")+'\';render()">'+c+'</button>'}).join('');
  var grid='repeat('+N+',1fr)';
  var h='<div class="g"><div class="hd name"><b>品目</b><span class="tot">保有</span></div><div class="hd tl"><div class="days" style="grid-template-columns:'+grid+'">'+days.map(function(d){var w=d.getDay();var s=ymd(d);return '<div class="'+dcls(d,t)+'" title="'+(HOL[s]||'')+'"><span class="dw">'+(HOL[s]||'日月火水木金土'[d.getDay()])+'</span>'+(d.getMonth()+1)+'/'+d.getDate()+'</div>'}).join('')+'</div></div>';
  var last='';var shown=0;
  ITEMS.filter(function(i){return !CAT||i.category===CAT}).forEach(function(it){
    var rows=RENT.filter(function(r){return r.category===it.category&&r.item_name===it.item_name&&['予約','貸出中','メンテ待ち','メンテ中','廃棄予定'].indexOf(r.status)>=0&&r.date_end>=dstr[0]&&r.date_start<=dstr[N-1]});
    var tot=Number(it.total_qty)||0;
    if(!rows.length&&CAT==='')return;   // 全部表示の時は動きのある品だけ
    shown++;
    if(it.category!==last){last=it.category;h+='<div class="cat">'+it.category+'</div>'}
    // レーン割り当て（重なる帯は下の段へ）
    rows.sort(function(a,b){return a.date_start<b.date_start?-1:1});var lanes=[];
    rows.forEach(function(r){var L=0;while(lanes[L]&&lanes[L]>=r.date_start)L++;lanes[L]=r.date_end;r._lane=L});
    var H=6+Math.max(1,lanes.length)*24+28;
    h+='<div class="name"><b>'+it.item_name+'</b><span class="tot">'+(tot||'未')+'</span></div><div class="tl" style="height:'+H+'px"><div class="bg" style="grid-template-columns:'+grid+'">'+days.map(function(d){var w=d.getDay();return '<div class="'+dcls(d,t)+'"></div>'}).join('')+'</div>';
    rows.forEach(function(r){var s=Math.max(0,dstr.indexOf(r.date_start.slice(0,10))<0?(r.date_start<dstr[0]?0:N):dstr.indexOf(r.date_start.slice(0,10)));var e=dstr.indexOf(r.date_end.slice(0,10));if(e<0)e=r.date_end>dstr[N-1]?N-1:0;
      var l=s/N*100,w=(e-s+1)/N*100;h+='<div class="bar '+cls(r)+'" style="left:'+l+'%;width:'+w+'%;top:'+(4+r._lane*24)+'px" title="'+(r.client_name||'')+' '+r.qty+' '+r.date_start.slice(0,10)+'〜'+r.date_end.slice(0,10)+' '+r.status+'">'+r.qty+' '+(r.client_name||'')+'</div>'});
    // 日ごとの空き
    var use=dstr.map(function(ds){var u=0;rows.forEach(function(r){if(r.date_start.slice(0,10)<=ds&&r.date_end.slice(0,10)>=ds)u+=Number(r.qty)||0});return u});
    h+='<div class="used" style="grid-template-columns:'+grid+'">'+use.map(function(u){return '<div>'+(u?u:'')+'</div>'}).join('')+'</div>';
    h+='<div class="free" style="grid-template-columns:'+grid+'">'+use.map(function(u){var f=tot-u;if(!tot||u===0)return '<div></div>';return '<div class="'+(f<=0?'zero':f<=Math.ceil(tot*0.3)?'low':'')+'">'+f+'</div>'}).join('')+'</div></div>';
  });
  h+='</div>';
  $('out').className='';$('out').innerHTML=shown?h:'<p class="empty">この期間に動きのある品はありません</p>';
  $('st').textContent='台帳 '+ITEMS.length+'品 ／ レンタル行 '+RENT.length;fixHd();
}
Promise.all([fetch(API+'?dept=inventory&action=list').then(function(r){return r.json()}),fetch(API+'?dept=inventory&action=rentals').then(function(r){return r.json()}),fetch(API+'?action=read&dept=project').then(function(r){return r.json()})]).then(function(a){
  ITEMS=(a[0]||[]).slice().sort(function(x,y){return (x.category+x.item_name).localeCompare(y.category+y.item_name,'ja')});RENT=a[1]||[];(a[2].data||[]).forEach(function(p){PROJ[p.project]=p.status});
  today();
}).catch(function(e){$('out').innerHTML='<p class="empty">読み込み失敗: '+e.message+'</p>'});
$('dn').onchange=render;$('d0').onchange=render;
</script></body></html>
