<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>秘書</title>
<link rel="icon" href="data:,">
<style>
body{margin:0;font-family:-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;font-size:14px;color:#222;background:#f6f7f8}
header{position:sticky;top:0;background:#fff;border-bottom:1px solid #ddd;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;z-index:2}
header h1{font-size:16px;margin:0 8px 0 0}
header .sel button{border:1px solid #bbb;background:#fff;padding:4px 10px;border-radius:4px;cursor:pointer}
header .sel button.on{background:#222;color:#fff;border-color:#222}
header .st{color:#777;font-size:12px;margin-left:auto}
header .sync{border:1px solid #2b6;color:#2b6;background:#fff;padding:4px 10px;border-radius:4px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:10px 12px 60px}
section{background:#fff;border:1px solid #e3e3e3;border-radius:6px;margin:10px 0;padding:8px 12px}
h2{font-size:14px;margin:0 0 6px;display:flex;align-items:center;gap:6px}
h2 .n{background:#222;color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
h2.warn .n{background:#d33}h2.boss .n{background:#c60}
.grp{color:#555;font-size:12px;margin:6px 0 2px}
.row{display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid #f0f0f0}
.row:first-of-type{border-top:0}
.row input{margin-top:3px}.row .b{flex:1;min-width:0}.row .m{font-size:12px;color:#666}.row .s{margin:1px 0}
.row.done .b{opacity:.45;text-decoration:line-through}
.tag{display:inline-block;font-size:11px;padding:0 5px;border-radius:3px;background:#eee;color:#444;margin-right:4px}
.tag.rep{background:#e6f5ea;color:#1a7a3a}.tag.no{background:#fde8e8;color:#b22}.tag.due{background:#fff3d6;color:#8a5a00}
a{color:#25a;text-decoration:none}
.cnt{font-size:13px;color:#444;line-height:1.7}
details summary{cursor:pointer;color:#666;font-size:13px}
.empty{color:#999;font-size:13px}
@media(max-width:480px){body{font-size:13px}main{padding:6px}section{padding:6px 8px}}
</style>
</head>
<body>
<header>
  <h1>秘書</h1>
  <span class="sel"><button data-d="1">今日</button><button data-d="3" class="on">3日</button><button data-d="7">1週間</button></span>
  <button class="sync" onclick="syncNow()">今すぐ更新</button>
  <span class="st" id="st"></span>
</header>
<main id="main"><p class="empty">読み込み中…</p></main>
<script>
// 秘書：GAS プロジェクト「秘書」（kototen.office）を API として使う。キーは ?k=（初回のみ、以後は localStorage）
var API='https://script.google.com/macros/s/AKfycbz1HO0bfr65_IhCisT4Q-zR6YZ-mQUEdRx7qfSqHLLoeVsVPCeaL48dn0b9w1xtfYUS/exec';
var K=(new URLSearchParams(location.search).get('k')||'');
try{ if(K) localStorage.setItem('sec_k',K); else K=localStorage.getItem('sec_k')||''; }catch(e){}
var DAYS=3,D=null;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(d){d=new Date(d);return (d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)}
function ago(d){var h=(Date.now()-new Date(d))/36e5;return h<1?Math.round(h*60)+'分':h<48?Math.round(h)+'時間':Math.round(h/24)+'日'}
function gl(id){return 'https://mail.google.com/mail/u/0/#all/'+id}
function row(r,opt){opt=opt||{};var t='';
  if(r.needsReply){t+=r.replied?'<span class="tag rep">返信済み '+esc(r.replied.by)+' '+fmt(r.replied.at)+'</span>':'<span class="tag no">未返信 '+ago(r.date)+'</span>'}
  if(r.due)t+='<span class="tag due">期日 '+esc(r.due).slice(5).replace('-','/')+'</span>';
  if(r.kind&&!opt.nokind)t+='<span class="tag">'+esc(r.kind)+'</span>';
  if(!r.classified)t+='<span class="tag">未分類</span>';
  return '<div class="row'+(r.done?' done':'')+'"><input type="checkbox" '+(r.done?'checked':'')+' onchange="toggle(\''+r.id+'\',this.checked)"><div class="b">'+
    '<div class="m">'+fmt(r.date)+' '+esc(r.company)+(r.fromName&&r.company!==r.fromName?' '+esc(r.fromName.replace(/<.*/,'')):'')+(r.person?' → '+esc(r.person):'')+' <a target="_blank" href="'+gl(r.id)+'">'+esc(r.subject||'(件名なし)')+'</a></div>'+
    '<div class="s">'+esc(r.summary)+'</div>'+(opt.ask&&r.ask?'<div class="m">確認: '+esc(r.ask)+'</div>':'')+'<div>'+t+'</div></div></div>'}
function sec(title,items,cls,opt){var live=items.filter(function(r){return !r.done}),done=items.filter(function(r){return r.done});
  var h='<section><h2 class="'+(cls||'')+'">'+title+'<span class="n">'+live.length+'</span></h2>';
  if(opt&&opt.group){var g={};live.forEach(function(r){var k=r[opt.group]||'（なし）';(g[k]=g[k]||[]).push(r)});
    Object.keys(g).sort().forEach(function(k){h+='<div class="grp">'+esc(k)+'（'+g[k].length+'）</div>'+g[k].map(function(r){return row(r,opt)}).join('')})}
  else h+=live.length?live.map(function(r){return row(r,opt)}).join(''):'<p class="empty">なし</p>';
  if(done.length)h+='<details><summary>完了 '+done.length+'</summary>'+done.map(function(r){return row(r,opt)}).join('')+'</details>';
  return h+'</section>'}
function render(){var it=D.items.filter(function(r){return r.date>=D.since}),all=D.items;var h='';
  var q=it.filter(function(r){return r.kind==='見積依頼'});var cc={};q.forEach(function(r){cc[r.company]=(cc[r.company]||0)+1});
  h+=sec('見積依頼 '+Object.keys(cc).map(function(k){return esc(k)+' '+cc[k]}).join('・'),q,'',{group:'company',nokind:true});
  h+=sec('未返信（相手が答えを待っている）',all.filter(function(r){return r.needsReply&&!r.replied&&r.kind!=='FAX'}),'warn');
  h+=sec('社長案件',all.filter(function(r){return r.boss}),'boss');
  h+=sec('各自に確認',all.filter(function(r){return r.ask&&!(r.needsReply&&r.replied)}),'',{group:'person',ask:true});
  h+=sec('FAX',it.filter(function(r){return r.dir==='fax'}),'',{nokind:true});
  var pc={};it.forEach(function(r){if(r.dir==='fax')return;var p=r.person||'なし';pc[p]=(pc[p]||0)+1});
  var outs=D.outs.filter(function(o){return o.date>=D.since});var sent={};outs.forEach(function(o){var b=o.by||'無記名';sent[b]=(sent[b]||0)+1});
  h+='<section><h2>件数</h2><div class="cnt">受信 '+it.filter(function(r){return r.dir!=='fax'}).length+'件（宛名別: '+Object.keys(pc).sort(function(a,b){return pc[b]-pc[a]}).map(function(k){return esc(k)+' '+pc[k]}).join('・')+'）<br>kt-info発 '+outs.length+'件（'+Object.keys(sent).map(function(k){return esc(k)+' '+sent[k]}).join('・')+'）</div></section>';
  h+='<section><details><summary>受信すべて（期間内 '+it.length+'件）</summary>'+it.slice().reverse().map(function(r){return row(r)}).join('')+'</details></section>';
  document.getElementById('main').innerHTML=h;
  document.getElementById('st').textContent='更新 '+(D.lastSync?fmt(D.lastSync):'未')}
function load(){
  if(!K){document.getElementById('main').innerHTML='<p class="empty">キーがありません（URL に ?k= を付けて開いてください）</p>';return}
  fetch(API+'?k='+encodeURIComponent(K)+'&a=data&days='+DAYS).then(function(r){return r.json()}).then(function(d){
    if(d.error){document.getElementById('main').innerHTML='<p class="empty">'+esc(d.error)+'</p>';return}
    D=d;render()}).catch(function(e){document.getElementById('main').innerHTML='<p class="empty">エラー: '+esc(e.message)+'</p>'})}
function toggle(id,f){var r=D.items.filter(function(x){return x.id===id})[0];if(r){r.done=f;render()}
  fetch(API,{method:'POST',mode:'no-cors',keepalive:true,headers:{'Content-Type':'text/plain'},body:JSON.stringify({k:K,action:'done',id:id,flag:f})})}
function syncNow(){document.getElementById('st').textContent='取得中…';
  fetch(API+'?k='+encodeURIComponent(K)+'&a=sync').then(function(){load()}).catch(function(e){document.getElementById('st').textContent='失敗 '+e.message})}
document.querySelectorAll('.sel button').forEach(function(b){b.onclick=function(){DAYS=Number(b.dataset.d);document.querySelectorAll('.sel button').forEach(function(x){x.classList.toggle('on',x===b)});load()}});
load();setInterval(load,5*60*1000);
</script>
</body>
</html>
